<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创业培训考核题库 · 即时检索</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#2f6fed;--green:#1a9b5c;--amber:#d98300;--line:#e6e8ec;--txt:#1d2330;--sub:#667085;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);}
  header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px;}
  h1{font-size:17px;margin:0 0 10px;font-weight:700;}
  h1 span{color:var(--sub);font-weight:500;font-size:13px;margin-left:8px;}
  .searchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  #q{flex:1;min-width:220px;padding:11px 14px;font-size:15px;border:1.5px solid var(--line);border-radius:10px;outline:none;}
  #q:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(47,111,237,.12);}
  .tabs{display:flex;gap:6px;}
  .tab{padding:8px 12px;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--sub);}
  .tab.on{background:var(--pri);color:#fff;border-color:var(--pri);}
  .tools{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  label.chk{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:5px;cursor:pointer;}
  .count{font-size:13px;color:var(--sub);margin-left:auto;}
  main{padding:16px;max-width:980px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .meta{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .badge{font-size:12px;padding:2px 9px;border-radius:20px;font-weight:600;}
  .badge.judge{background:#eef4ff;color:#2f6fed;}
  .badge.single{background:#e9f8f0;color:#1a9b5c;}
  .badge.multi{background:#fff4e5;color:#d98300;}
  .no{font-size:12px;color:var(--sub);}
  .stem{font-size:15px;line-height:1.6;margin-bottom:8px;font-weight:600;}
  .opts{font-size:14px;line-height:1.75;color:#333;margin-bottom:10px;}
  .opt{padding-left:2px;}
  .opt.right{color:#1a9b5c;font-weight:700;}
  .opt.right::after{content:"  ✓";}
  .ans{display:inline-block;background:#e9f8f0;color:#1a9b5c;font-weight:700;padding:3px 12px;border-radius:8px;border:1px solid #bfe8d3;}
  .ans.judge{background:#eef4ff;color:#2f6fed;border-color:#c7dbff;}
  .hide-ans .opt.right{color:#333;font-weight:400;}
  .hide-ans .opt.right::after{content:"";}
  .hide-ans .ans{background:#eef1f5;color:transparent;border-color:#e6e8ec;user-select:none;}
  .hide-ans .ans::before{content:"答案已隐藏";color:#98a2b3;font-weight:400;}
  .empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:15px;}
  mark{background:#fff2a8;padding:0 1px;border-radius:2px;}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;}
</style>
</head>
<body>
<header>
  <h1>创业培训考核题库 · 即时检索 <span id="total"></span></h1>
  <div class="searchrow">

    <div class="tabs">

      <div class="tab" data-type="single">单选题</div>
      <div class="tab" data-type="multi">多选题</div>
    </div>
  </div>
  <div class="tools">
    <label class="chk"><input type="checkbox" id="hide"> 隐藏答案（自测模式）</label>
    <span class="count" id="count"></span>
  </div>
  <div class="hint">支持多关键词，用空格分隔（如“头脑风暴 四条线”）。</div>
</header>
<main id="list"></main>

const TYPE = {judge:'判断题', single:'单选题', multi:'多选题'};
let curType='all', hideAns=false;
const $=s=>document.querySelector(s);
$('#total').textContent = '共 '+DATA.length+' 题';
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(text, terms){
  let out = esc(text);
  if(!terms.length) return out;
  terms.forEach(t=>{
    if(!t) return;
    const safe = t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try{ out = out.replace(new RegExp('('+safe+')','gi'),'<mark>$1</mark>'); }catch(e){}
  });
  return out;
}
function render(){
  const raw = $('#q').value.trim();
  const terms = raw.toLowerCase().split(/\s+/).filter(Boolean);
  const list = $('#list');
  list.className = hideAns ? 'hide-ans' : '';
  let arr = DATA.filter(item=> curType==='all' || item.t===curType);
  if(terms.length){
    arr = arr.filter(item=>{
      const hay = (item.s+' '+item.o.join(' ')+' '+item.a+' '+TYPE[item.t]).toLowerCase();
      return terms.every(t=>hay.includes(t));
    });
  }
  $('#count').textContent = '匹配 '+arr.length+' 题';
  if(!arr.length){ list.innerHTML = '<div class="empty">没有匹配的题目，换个关键词试试～</div>'; return; }
  let html='';
  for(const it of arr){
    const anset = new Set(it.a.replace(/[^A-E]/g,'').split(''));
    let opts = it.o.map(o=>{ const k=o[0]; const right=anset.has(k);
      return '<div class="opt'+(right?' right':'')+'">'+ hl(o, terms) +'</div>'; }).join('');
    html += '<div class="card"><div class="meta">'
      +'<span class="badge '+it.t+'">'+TYPE[it.t]+'</span>'
      +'<span class="no">第 '+it.n+' 题</span></div>'
      +'<div class="stem">'+ hl(it.s, terms) +'</div>'
      +'<div class="opts">'+ opts +'</div>'
      +'<div class="ansrow"><span class="ans '+it.t+'">答案：'+it.a+'</span></div></div>';
  }
  list.innerHTML=html;
}
let tm;
$('#q').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(render,120);});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); curType=t.dataset.type; render();
}));
$('#hide').addEventListener('change',e=>{hideAns=e.target.checked; render();});
render();
</script>
